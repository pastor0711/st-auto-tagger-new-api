<div class="auto-tagger-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Auto Tagger</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">


            <div class="auto-tagger_block flex-container">
                <input id="chub-import" class="menu_button" type="submit" value="Import All Character Info from CHUB" />
            </div>
            <div class="auto-tagger_block flex-container">
                <input id="chub-import-single" class="menu_button" type="submit" value="Import Current Character Info from CHUB" />
            </div>
            <div class="auto-tagger_block flex-container">
                <input id="get_creators_notes" type="checkbox" /> <!-- New checkbox for using alt description -->
                <label for="get_creators_notes">Pull Creator's Notes from CHUB</label>
            </div>
            <div class="auto-tagger_block flex-container">
                <input id="use_alt_desc" type="checkbox" /> <!-- New checkbox for using alt description -->
                <label for="use_alt_desc">Use Tagline As Creator's Notes</label>
            </div>
            <!-- Collapsible Chub.ai API Token Section -->
            <div class="auto-tagger_block flex-container">
                <div class="collapsible-header" onclick="toggleCollapsible('chub-token-section')" style="width: 100%; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 8px; border-radius: 4px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                    <label for="chub_api_token" style="margin: 0; font-weight: 500; color: var(--text-color);">
                        🔐 Chub.ai API Token Setup
                    </label>
                    <span class="collapsible-icon" style="font-size: 14px; color: var(--text-color-muted); display: inline-block; transition: transform 0.3s ease;">▼</span>
                </div>
                <div id="chub-token-section" class="collapsible-content" style="display: none; width: 100%; margin-top: 12px; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 4px; border: 1px solid rgba(255,255,255,0.05);">
                    <div style="margin-bottom: 12px; font-size: 13px; line-height: 1.4; opacity: 0.8;">
                        <strong style="color: var(--text-color);">🔑 How to get your token:</strong><br>
                        <ol style="margin: 8px 0 0 0; padding-left: 20px;">
                            <li>Open <a href="https://chub.ai" target="_blank" style="color: var(--link-color);">chub.ai</a> and log in</li>
                            <li>Press <strong>F12</strong>, go to <strong>Application/Storage</strong> tab</li>
                            <li>Click <strong>Local Storage</strong> → <strong>https://chub.ai</strong></li>
                            <li>Find <strong>URQL_TOKEN</strong> and copy its value (the long string)</li>
                            <li>Paste it in the field below</li>
                        </ol>
                    </div>
                    <input id="chub_api_token" type="password" placeholder="Paste your Chub.ai token here..." style="width: 100%; padding: 8px; font-family: 'Courier New', monospace; font-size: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: var(--text-color);" />
                </div>
            </div>
            <!-- Dropdown to determine strategy, tooltips to indicate what they do -->
            <div class="auto-tagger_block flex-container">
                <span>Skip Strategy?</span> </br>
                <select id="skip_strategy">
                    <option title="If it has tags or author info, skip." value="0">Skip if Existing</option>
                    <option title="Add the author info/notes to the end. Tags added."value="1">Append to Existing</option>
                    <option title="Write over author info / notes. Doesn't affect tags."value="2">Overwrite Existing</option>
                </select>
            </div>
            <!-- A slider for the dice threshold -->
            <div class="auto-tagger_block flex-container">
                <label for="dice_threshold">Dice Threshold (<span id="dice_threshold_value"></span>)</label>
                <input id="dice_threshold" type="range" min=".1" max="1" step=".1"/>

            </div>
            <!-- A slider for the number to search for threshold -->
            <div class="auto-tagger_block flex-container">
                <label for="find_count">Search Width (<span id="find_count_value"></span> characters)</label>
                <input id="find_count" type="range" min="1" max="40"/>
            </div>

            <!-- New div for comparison results -->
            <div id="comparison-results"></div>

            <hr class="sysHR">
        </div>
    </div>
